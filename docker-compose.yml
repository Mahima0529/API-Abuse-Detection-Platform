version: '3.8'

services:
  # 1. Redis Cache & Block Store
  redis:
    image: redis:7-alpine
    container_name: shield_api_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  # 2. Apache Zookeeper (Kafka Coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: shield_api_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  # 3. Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: shield_api_kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 4. Single Backend Express Server Container
  microservices-cluster:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shield_api_backend_cluster
    depends_on:
      - redis
      - kafka
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: super_secret_jwt_key_phase1_2026_api_abuse_detection_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:9092
      RATE_LIMIT_REGISTRATION_LIMIT: 5
      RATE_LIMIT_LOGIN_LIMIT: 10
      RATE_LIMIT_GENERAL_LIMIT: 100
      TEMP_BLOCK_TTL_SEC: 300
    restart: unless-stopped

  # 5. Ingress API Gateway (Host Port 8080 -> Internal Port 5000)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: shield_api_gateway
    depends_on:
      - microservices-cluster
    environment:
      PORT: 5000
      BACKEND_HOST: microservices-cluster
      BACKEND_PORT: 5000
    ports:
      - '8080:5000'
    restart: unless-stopped

  # 6. React Analytics Dashboard Frontend (Host Port 5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shield_api_frontend
    depends_on:
      - api-gateway
    ports:
      - '5173:5173'
    restart: unless-stopped

networks:
  default:
    name: shield_api_network
